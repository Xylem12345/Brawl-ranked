<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Ranked Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            font-style: italic;
            margin-bottom: 16px;
            text-align: center;
            color: #e0e0e0;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }
        .title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0a0;
            margin-bottom: 8px;
        }
        .stats-main {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .win { color: #2ecc71; }
        .loss { color: #e74c3c; }
        .stats-sub {
            display: flex;
            justify-content: space-around;
            font-size: 0.9rem;
            color: #b0b0b0;
            margin-bottom: 12px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        .btn-win { background-color: #1b4332; color: #52b788; border: 1px solid #2d6a4f; }
        .btn-loss { background-color: #5c1d1d; color: #e76f51; border: 1px solid #782929; }
        .btn-action-primary { background-color: #0b3c5d; color: #329d9c; width: 100%; margin-top: 8px; }
        .btn-action-danger { background-color: #5d250b; color: #e27d60; width: 100%; margin-top: 8px; }
        .btn-save { background-color: #5849be; color: #ffffff; width: 100%; margin-top: 12px; }
        .points-display {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 8px 0;
            color: #f1c40f;
        }
        input[type="number"] {
            width: 100%;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <h1>Brawl Stars Ranked Tracker</h1>

    <!-- SESIÓN DE PARTIDAS -->
    <div class="card">
        <div class="title">Sesión Actual</div>
        <div class="stats-main"><span id="wins">0</span>W - <span id="losses">0</span>L</div>
        <div class="stats-sub">
            <span>Winrate: <span id="winrate">0</span>%</span>
            <span>Racha: <span id="streak">0</span></span>
        </div>
        <div class="btn-row">
            <button class="btn-win" onclick="addMatch(true)">+1 Victoria</button>
            <button class="btn-loss" onclick="addMatch(false)">+1 Derrota</button>
        </div>
    </div>

    <!-- PUNTOS DE RANKED -->
    <div class="card">
        <div class="title">Puntos de Ranked (Balance Sesión)</div>
        <div class="points-display" id="pointsDisplay">0</div>
        <input type="number" id="pointsInput" value="100" placeholder="Ej: 100 o -84">
        <div class="btn-row">
            <button class="btn-action-primary" onclick="modifyPoints(true)">+ Sumar Puntos</button>
            <button class="btn-action-danger" onclick="modifyPoints(false)">- Restar Puntos</button>
        </div>
        <button class="btn-save" onclick="saveSession()">🏁 Finalizar y Guardar Sesión</button>
    </div>

    <!-- HISTORIAL -->
    <div class="card">
        <div class="title">Historial de Sesiones</div>
        <div id="historyList" style="font-size: 0.85rem; color: #aaa; margin-bottom: 10px;">No hay sesiones guardadas todavía.</div>
        <button style="background: #333; color: #ccc; font-size: 0.8rem; padding: 8px;" onclick="resetData()">Reiniciar Datos</button>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('bs_ranked_state_v2')) || {
            wins: 0,
            losses: 0,
            streak: 0,
            sessionPoints: 0,
            history: []
        };

        function updateUI() {
            document.getElementById('wins').innerText = state.wins;
            document.getElementById('losses').innerText = state.losses;
            document.getElementById('streak').innerText = state.streak;
            
            let totalMatches = state.wins + state.losses;
            let wr = totalMatches > 0 ? Math.round((state.wins / totalMatches) * 100) : 0;
            document.getElementById('winrate').innerText = wr;

            let pDisplay = document.getElementById('pointsDisplay');
            pDisplay.innerText = state.sessionPoints;
            pDisplay.style.color = state.sessionPoints >= 0 ? '#2ecc71' : '#e74c3c';

            let historyDiv = document.getElementById('historyList');
            if (state.history.length === 0) {
                historyDiv.innerHTML = "No hay sesiones guardadas todavía.";
            } else {
                historyDiv.innerHTML = state.history.map(h => 
                    `<div>Partidas: ${h.wins}W-${h.losses}L | Puntos: ${h.points > 0 ? '+' + h.points : h.points}</div>`
                ).join('');
            }

            localStorage.setItem('bs_ranked_state_v2', JSON.stringify(state));
        }

        function addMatch(isWin) {
            if (isWin) {
                state.wins++;
                state.streak = state.streak >= 0 ? state.streak + 1 : 1;
            } else {
                state.losses++;
                state.streak = state.streak <= 0 ? state.streak - 1 : -1;
            }
            updateUI();
        }

        function modifyPoints(isAdd) {
            let val = parseInt(document.getElementById('pointsInput').value) || 0;
            if (isAdd) {
                state.sessionPoints += val;
            } else {
                state.sessionPoints -= val;
            }
            updateUI();
        }

        function saveSession() {
            if (state.wins === 0 && state.losses === 0 && state.sessionPoints === 0) return;
            state.history.unshift({
                wins: state.wins,
                losses: state.losses,
                points: state.sessionPoints
            });
            state.wins = 0;
            state.losses = 0;
            state.streak = 0;
            state.sessionPoints = 0;
            updateUI();
        }

        function resetData() {
            if (confirm("¿Reiniciar todos los datos?")) {
                state = { wins: 0, losses: 0, streak: 0, sessionPoints: 0, history: [] };
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
