<html lang="es">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Brawl Stars Ranked Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:ital,wght@0,600;0,800;0,900;1,800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Manifest dinámico para convertir en App Standalone sin barra arriba -->
    <link rel="manifest" id="manifest-link">

    <style>
        body {
            background-color: #0b0c0e;
            color: #f1f5f9;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Tarjetas Oscuras estilo Brawl Stars */
        .bs-card {
            background-color: #17181c;
            border: 1px solid #262930;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        /* Colores exactos de los botones según captura */
        .btn-green-bs {
            background: linear-gradient(180deg, #164e32 0%, #0d311f 100%);
            border: 1px solid #22c55e44;

            background: #15803d;

        }

        .btn-red-bs {
            background: linear-gradient(180deg, #4c1d24 0%, #2e1015 100%);
            border: 1px solid #ef444444;

        }
        .btn-red-bs:active {
            background: #b91c1c;
            transform: scale(0.98);
        }

        .btn-blue-bs {
            background: linear-gradient(180deg, #133c55 0%, #0c2637 100%);
            border: 1px solid #38bdf844;
            color: #38bdf8;
        }
        .btn-blue-bs:active {
            background: #0284c7;
            transform: scale(0.98);
        }

        .btn-orange-bs {
            background: linear-gradient(180deg, #4a2717 0%, #2f170c 100%);
            border: 1px solid #fb923c44;
            color: #fb923c;
        }
        .btn-orange-bs:active {
            background: #c2410c;
            transform: scale(0.98);
        }

        .btn-purple-bs {
            background: linear-gradient(180deg, #7e22ce 0%, #6b21a8 100%);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }
        .btn-purple-bs:active {
            background: #9333ea;
            transform: scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen p-4 max-w-md mx-auto flex flex-col justify-start pb-8">

    <!-- Título Principal -->
    <header class="text-center my-4">
        <h1 class="font-orbitron italic font-black text-2xl tracking-wider text-slate-100">
            Brawl Stars Ranked Tracker
        </h1>
    </header>

    <main class="space-y-4">

        <!-- TARJETA 1: SESIÓN ACTUAL -->
        <section class="bs-card rounded-2xl p-5 text-center relative overflow-hidden">
            <h2 class="text-xs font-bold font-orbitron tracking-widest text-slate-400 uppercase mb-3">
                SESIÓN ACTUAL
            </h2>

            <!-- Marcador W - L -->
            <div class="flex justify-center items-center gap-3 font-orbitron italic font-black text-4xl mb-4">
                <span id="wins-display" class="text-emerald-400">0W</span>
                <span class="text-slate-500">—</span>
                <span id="losses-display" class="text-red-500">0L</span>
            </div>

            <!-- Stats Secundarias -->
            <div class="flex justify-center items-center gap-6 text-sm text-slate-300 mb-5 font-semibold">
                <div>
                    <span class="text-slate-400">Winrate:</span> 
                    <span id="winrate-display" class="font-orbitron text-slate-100">0%</span>
                </div>
                <div>
                    <span class="text-slate-400">Racha:</span> 
                    <span id="streak-display" class="font-orbitron text-slate-100">0</span>
                </div>
            </div>

            <!-- Botones +1 Victoria / +1 Derrota -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="addWin()" class="btn-green-bs font-orbitron font-bold py-3.5 px-2 rounded-xl text-base italic transition flex items-center justify-center">
                    +1 Victoria
                </button>
                <button onclick="addLoss()" class="btn-red-bs font-orbitron font-bold py-3.5 px-2 rounded-xl text-base italic transition flex items-center justify-center">
                    +1 Derrota
                </button>
            </div>
        </section>


        <!-- TARJETA 2: PUNTOS DE RANKED -->
        <section class="bs-card rounded-2xl p-5 text-center">
            <h2 class="text-xs font-bold font-orbitron tracking-widest text-slate-400 uppercase mb-3">
                PUNTOS DE RANKED
            </h2>

            <!-- Visualizador de Puntos -->
            <div id="ranked-points" class="font-orbitron italic font-black text-4xl text-slate-100 my-2">
                0
            </div>

            <!-- Input / Modificador de Paso -->
            <div class="mb-4">
                <input type="number" id="step-input" value="100" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl py-2 px-4 text-center font-orbitron font-bold text-slate-200 focus:outline-none focus:border-cyan-500" placeholder="Puntos por partida">
            </div>

            <!-- Botones de Sumar / Restar Puntos -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="addPoints()" class="btn-blue-bs font-orbitron font-bold py-3 px-2 rounded-xl text-sm italic transition">
                    + Puntos
                </button>
                <button onclick="subtractPoints()" class="btn-orange-bs font-orbitron font-bold py-3 px-2 rounded-xl text-sm italic transition">
                    - Puntos
                </button>
            </div>

            <!-- Botón Guardar Sesión -->
            <button onclick="finishSession()" class="btn-purple-bs w-full font-orbitron font-bold py-3.5 px-4 rounded-xl text-slate-100 italic transition flex items-center justify-center gap-2">
                🏁 Finalizar y Guardar Sesión
            </button>
        </section>


        <!-- TARJETA 3: HISTORIAL DE SESIONES -->
        <section class="bs-card rounded-2xl p-5">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold font-orbitron tracking-widest text-slate-400 uppercase">
                    HISTORIAL DE SESIONES
                </h2>
                <button id="clear-history-btn" onclick="clearHistory()" class="text-xs text-red-400 hover:text-red-300 hidden font-bold">
                    Borrar Historial
                </button>
            </div>

            <div id="history-container" class="space-y-2">
                <p class="text-center text-slate-400 italic text-sm py-4 font-semibold">
                    No hay sesiones guardadas todavía.
                </p>
            </div>
        </section>

    </main>

    <script>
        // Claves de Almacenamiento Persistente Local
        const STORAGE_CURRENT = 'BRAWL_STARS_CURRENT_SESSION_V2';
        const STORAGE_HISTORY = 'BRAWL_STARS_HISTORY_V2';

        // Estado inicial de la sesión
        let currentSession = {
            wins: 0,
            losses: 0,
            streak: 0,
            points: 0
        };

        let history = [];

        // Referencias a elementos del DOM
        const winsEl = document.getElementById('wins-display');
        const lossesEl = document.getElementById('losses-display');
        const winrateEl = document.getElementById('winrate-display');
        const streakEl = document.getElementById('streak-display');
        const pointsEl = document.getElementById('ranked-points');
        const stepInput = document.getElementById('step-input');
        const historyContainer = document.getElementById('history-container');
        const clearHistoryBtn = document.getElementById('clear-history-btn');

        // Configuración para permitir que la app sea instalable como App nativa (sin barra de navegador)
        function initPWA() {
            const manifestObj = {
                name: "Brawl Stars Ranked Tracker",
                short_name: "Ranked Tracker",
                start_url: "./",
                display: "standalone",
                background_color: "#0b0c0e",
                theme_color: "#0b0c0e",
                icons: [{
                    src: "https://placehold.co/192x192/0b0c0e/4ade80?text=BS+Ranked",
                    sizes: "192x192",
                    type: "image/png"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
            document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

            // Inyectar Service Worker en linea para habilitar PWA en GitHub Pages
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('activate', e => self.clients.claim());
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
                `;
                const swBlob = new Blob([swCode], { type: 'text/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
            }
        }

        // Cargar Datos Guardados de la Memoria del Celular
        function loadData() {
            try {
                const savedCurrent = localStorage.getItem(STORAGE_CURRENT);
                if (savedCurrent) {
                    currentSession = JSON.parse(savedCurrent);
                }
                const savedHistory = localStorage.getItem(STORAGE_HISTORY);
                if (savedHistory) {
                    history = JSON.parse(savedHistory);
                }
            } catch (e) {
                console.error("Error al cargar localStorage:", e);
            }
            updateUI();
            renderHistory();
        }

        // Guardar Datos Inmediatamente en la Memoria del Celular
        function saveData() {
            try {
                localStorage.setItem(STORAGE_CURRENT, JSON.stringify(currentSession));
                localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history));
            } catch (e) {
                console.error("Error al guardar localStorage:", e);
            }
        }

        // Actualización de la Interfaz
        function updateUI() {
            winsEl.textContent = `${currentSession.wins}W`;
            lossesEl.textContent = `${currentSession.losses}L`;

            const total = currentSession.wins + currentSession.losses;
            const winrate = total > 0 ? Math.round((currentSession.wins / total) * 100) : 0;
            winrateEl.textContent = `${winrate}%`;
            streakEl.textContent = currentSession.streak;

            pointsEl.textContent = currentSession.points;
        }

        // Acciones de Marcador
        function addWin() {
            currentSession.wins++;
            currentSession.streak = currentSession.streak < 0 ? 1 : currentSession.streak + 1;
            saveData();
            updateUI();
        }

        function addLoss() {
            currentSession.losses++;
            currentSession.streak = currentSession.streak > 0 ? -1 : currentSession.streak - 1;
            saveData();
            updateUI();
        }

        function getStep() {
            const val = parseInt(stepInput.value, 10);
            return isNaN(val) ? 100 : val;
        }

        function addPoints() {
            currentSession.points += getStep();
            saveData();
            updateUI();
        }

        function subtractPoints() {
            currentSession.points -= getStep();
            saveData();
            updateUI();
        }

        // Guardar Sesión Actual en el Historial
        function finishSession() {
            if (currentSession.wins === 0 && currentSession.losses === 0 && currentSession.points === 0) return;

            const sessionRecord = {
                id: Date.now(),
                date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }),
                wins: currentSession.wins,
                losses: currentSession.losses,
                points: currentSession.points
            };

            history.unshift(sessionRecord);
            
            // Reiniciar sesión activa
            currentSession = { wins: 0, losses: 0, streak: 0, points: 0 };
            
            saveData();
            updateUI();
            renderHistory();
        }

        // Renderizar Lista de Historial
        function renderHistory() {
            if (history.length === 0) {
                historyContainer.innerHTML = `
                    <p class="text-center text-slate-400 italic text-sm py-4 font-semibold">
                        No hay sesiones guardadas todavía.
                    </p>
                `;
                clearHistoryBtn.classList.add('hidden');
                return;
            }

            clearHistoryBtn.classList.remove('hidden');
            historyContainer.innerHTML = history.map(item => `
                <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 flex justify-between items-center text-sm">
                    <div>
                        <div class="font-orbitron font-bold text-slate-200">
                            <span class="text-emerald-400">${item.wins}W</span> — <span class="text-red-400">${item.losses}L</span>
                        </div>
                        <div class="text-xs text-slate-500">${item.date}</div>
                    </div>
                    <div class="font-orbitron font-black text-base ${item.points >= 0 ? 'text-cyan-400' : 'text-orange-400'}">
                        ${item.points >= 0 ? '+' + item.points : item.points} Pts
                    </div>
                </div>
            `).join('');
        }

        function clearHistory() {
            history = [];
            saveData();
            renderHistory();
        }

        // Eventos clave para autosalvado en segundo plano / pantalla apagada
        window.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') saveData();
        });
        window.addEventListener('pagehide', saveData);
        window.addEventListener('beforeunload', saveData);

        // Al cargar la pantalla
        window.onload = function() {
            initPWA();
            loadData();
        };
    </script>
</body>
</html>
